<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#202b29"><title>山河舆图 · 分层地理图集</title><link rel="stylesheet" href="style.css?v=song-routes"></head><body>
<header><div class="brand"><span class="seal">山河<br>舆图</span><div><h1>山河舆图</h1><span class="latin">SHANHE ATLAS</span></div></div><nav id="countrySwitch" class="country-switch" aria-label="切换国家"></nav><select id="atlasLanguage" aria-label="显示语言" hidden></select><form class="atlas-search" role="search" autocomplete="off"><i data-icon="search"></i><input id="placeSearch" type="search" role="combobox" aria-label="搜索行政区" aria-autocomplete="list" aria-controls="placeResults" aria-expanded="false" placeholder="搜索省、市、区县"><ul id="placeResults" role="listbox" aria-label="行政区候选" hidden></ul><p id="placeSearchStatus" role="status" hidden></p></form><a href="notes.html" class="notes"><i data-icon="book"></i> 图志手记</a></header>
<main><aside><div class="sidetop"><span class="eyebrow">CARTOGRAPHY</span><h2>图层典藏</h2><div class="rule"></div></div><nav id="themes" aria-label="地图主题"></nav>
<section class="legend"><h3>舆图图例 <span>LEGEND</span></h3><div id="legend"></div></section>
<section class="settings"><h3>显示设置 <span>DISPLAY</span></h3><label>地名标注<input type="checkbox" id="labels" checked><i></i></label><label>地势晕渲<input type="checkbox" id="shade" checked><i></i></label></section>
<div class="asidefoot"><span>✧</span> 山河舆图编绘室 <span>✧</span></div></aside>
<section id="viewport" aria-label="中国交互地图"><canvas id="terrainSurface" aria-hidden="true"></canvas><canvas id="map" tabindex="0" aria-label="方向键平移，加减键缩放，回到全国请按 Home"></canvas><div class="titleplate"><div><span class="redline"></span><small id="plateEnglish">ADMINISTRATIVE ATLAS</small></div><h2 id="plateName">中国行政区划图</h2><p id="plateLevel">全国视野 · 省级政区</p><div id="usRegions" class="region-switch" role="group" aria-label="地图区域" hidden></div></div>
<div class="compass" aria-hidden="true"><b>N</b><svg viewBox="0 0 84 84"><g fill="none" stroke="currentColor"><circle cx="42" cy="42" r="23"/><circle cx="42" cy="42" r="19" stroke-dasharray="1 4"/><path d="m23 23 38 38m0-38L23 61"/></g><g id="rose"></g><circle cx="42" cy="42" r="3" fill="#e9deb9" stroke="currentColor"/></svg></div>
<details class="mobile-legend"><summary>图例</summary><div id="mobileLegend"></div><label>地名标注<input type="checkbox" id="mobileLabels" checked></label><label>地势晕渲<input type="checkbox" id="mobileShade" checked></label></details>
<figure id="inset" aria-label="南海诸岛示意附图"><canvas width="216" height="204" id="insetMap"></canvas><figcaption>南海诸岛示意</figcaption></figure>
<div id="tooltip" hidden></div><article id="detail" hidden><button class="dismiss" aria-label="关闭详情">×</button><small id="crumb"></small><h2 id="place"></h2><p id="detailText"></p><div id="detailSources" hidden></div><select id="districtPicker" aria-label="选择区县" hidden></select><div id="universityDetail" hidden></div><div id="railDetail" hidden></div><button id="closer">放大查看　↗</button></article>
<div class="maptools"><button id="plus" aria-label="放大">＋</button><button id="minus" aria-label="缩小">−</button><button id="home" aria-label="返回全国"><i data-icon="focus"></i></button></div>
<div class="scale"><span id="scaleValue"></span><div></div></div><div class="hint" id="hint">滚轮缩放　·　拖动平移　·　点选地区</div><div id="loading" role="status">载入舆图…</div><div id="terrainStatus" role="status" hidden></div></section></main><footer><div><i class="dot"></i><span id="status">行政疆域</span><em>/</em><span id="level">省级视图</span></div><div id="adminLevels" role="group" aria-label="行政区划层级"><button type="button" data-level="0">省级</button><button type="button" data-level="1">地级</button><button type="button" data-level="2">县级</button></div><div id="coords">104.00° E　35.00° N</div></footer>
